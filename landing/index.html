<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 翻唱 - So-VITS-SVC</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
:root{--bg:#0f1117;--card:#1a1d27;--text:#f0f0f5;--sub:#a0a3b0;--muted:#6b6f80;--accent:#6366f1;--accent-hover:#5558e6;--border:#2a2d3a;--radius:14px}
[data-theme="light"]{--bg:#f5f5f8;--card:#fff;--text:#1a1a2e;--sub:#555;--muted:#999;--border:#e0e0e8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:background .3s,color .3s}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);max-width:560px;width:100%;padding:48px 40px;text-align:center;transition:background .3s}
h1{font-size:2rem;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--sub);font-size:1rem;margin-bottom:28px;line-height:1.6}
.features{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;text-align:left}
.feature{display:flex;align-items:flex-start;gap:10px;color:var(--sub);font-size:.9rem}
.feature-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
.btn{display:inline-block;padding:14px 48px;background:var(--accent);color:#fff;text-decoration:none;border-radius:var(--radius);font-size:1.05rem;font-weight:600;transition:all .2s}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,.35)}
.footer{margin-top:32px;color:var(--muted);font-size:.8rem}
.footer a{color:var(--accent);text-decoration:none}
.toggle{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.toggle:hover{border-color:var(--accent)}
@media(max-width:480px){.card{padding:32px 20px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<button class="toggle" onclick="toggleTheme()" aria-label="切换主题" id="themeBtn">&#x263C;</button>
<div class="card">
  <h1>AI 翻唱</h1>
  <p class="sub">上传纯人声英文歌曲，选择目标音色，即刻生成 AI 翻唱。基于 So-VITS-SVC 4.0，搭载两个自训练真人语音模型。</p>
  <div class="features">
    <div class="feature"><span class="feature-dot"></span>两个语音模型可选（2602 / DASA），基于英文歌曲人声训练</div>
    <div class="feature"><span class="feature-dot"></span>支持 WAV、MP3、FLAC、OGG、M4A 格式，最长 5 分钟</div>
    <div class="feature"><span class="feature-dot"></span>GPU 加速推理（RTX 3060），处理时间约 30&ndash;60 秒</div>
    <div class="feature"><span class="feature-dot"></span>实时排队状态跟踪，并发控制</div>
  </div>
  <a href="http://8.134.50.67" class="btn">进入应用</a>
</div>
<footer class="footer">
  <p>&copy; 2026 zvi &middot; <a href="mailto:zviman888@163.com">zviman888@163.com</a></p>
</footer>
<script>
function toggleTheme(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';document.getElementById('themeBtn').innerHTML=h.dataset.theme==='dark'?'&#x263C;':'&#x263E;'}
</script>
</body>
</html>
