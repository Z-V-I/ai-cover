# ============================================================
# 决策层 + 前端的 Nginx 反向代理
# 部署到 ECS：cp nginx.conf /etc/nginx/sites-available/svc-decision
# ------------------------------------------------------------
# 线上实跑版本与本文件的差异只有两处（按需改回）：
#   server_name  _  →  <ECS_IP>        （线上写死了具体 IP）
#   X-Forwarded-Proto $scheme → http   （线上是 HTTP 直连）
# ============================================================
#
# ⚠ 限流参数务必留足余量！
#   历史教训：这里曾被配成 rate=1r/s burst=3，而前端轮询本身
#   就有约 1.1 请求/秒（每 2 秒一次 /api/status，且每次都顺手
#   打一次 /api/health），相当于把访客 IP 精准顶在限流线上。
#   结果每跑完一次推理，该 IP 就被打进 429 限流舱，表现为
#   "一直提示离线、加载不出语音列表"，而且 429 返回的是 nginx
#   的 HTML 错误页，前端 res.json() 直接抛 "Unexpected token '<'"。
#   现在的策略：保留防刷能力，但阈值远高于正常使用量；
#   并把 429 改成 JSON，让前端能优雅处理。
#
# ⚠ zone 名用项目专属的 aicover_api，不要用通用的 api：
#   limit_req_zone 属于 nginx 全局（http 块）命名空间，服务器上
#   如果还有别的站点，用通用名会和它们冲突。
# ============================================================
limit_req_zone $binary_remote_addr zone=aicover_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 70M;

    root /var/www/ai-cover;
    index index.html;

    # 限流触发时返回 JSON，而不是 nginx 默认的 HTML 错误页
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"请求过于频繁，请稍后重试","code":429}';
    }

    location /api/ {
        limit_req zone=aicover_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # 大文件下载（结果音频可达几十 MB）不要走缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 静态资源走协商缓存（no-cache 不是"不缓存"，而是每次都向服务端确认）：
    # 改完前端后用户刷新即可拿到新文件，不必依赖 Ctrl+F5。
    # 不加这个头时浏览器会用启发式缓存，可能继续跑旧的 app.js，
    # 让人误以为"改了没生效"。
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
